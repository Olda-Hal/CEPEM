x-logging: &default-logging
  options:
    max-size: "10m"
    max-file: "3"

services:
  # MySQL Database (Development only - use AWS Aurora in production)
  mysql:
    image: mysql:8.0.40
    container_name: cepem_mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cepem_network

  # Antivirus scanning for uploaded photos, PDFs and MEIK measurements.
  # Set CLAMAV_ENABLED=false to skip scans (clamd stays idle).
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - cepem_network

  # Database API
  # Paper intake-form digitisation (OCR + optional vision model).
  ai-service:
    build:
      context: ./backend/AIService
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TESSERACT_LANG=${TESSERACT_LANG:-ces+eng}
      - VISION_API_URL=${VISION_API_URL:-}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_MODEL=${VISION_MODEL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cepem_network

  database-api:
    build:
      context: ./backend
      dockerfile: DatabaseAPI/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${DATABASE_API_PORT}:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS_DATABASE}
      - ConnectionStrings__DefaultConnection=${DATABASE_API_CONNECTION_STRING}
      - PhotoEncryption__Key=${PHOTO_ENCRYPTION_KEY}
      - PhotoEncryption__IV=${PHOTO_ENCRYPTION_IV}
      - DocumentEncryption__Key=${DOCUMENT_ENCRYPTION_KEY}
      - DocumentEncryption__IV=${DOCUMENT_ENCRYPTION_IV}
      - PhotoStorage__Path=${PHOTO_STORAGE_PATH}
      - DocumentStorage__Path=${DOCUMENT_STORAGE_PATH}
      - DocumentRetention__Enabled=${DOCUMENT_RETENTION_ENABLED:-true}
      - DocumentRetention__RetentionDays=${DOCUMENT_RETENTION_RETENTION_DAYS:-30}
      - DocumentRetention__CleanupIntervalHours=${DOCUMENT_RETENTION_CLEANUP_INTERVAL_HOURS:-24}
      - ActivityLogRetention__Enabled=${ACTIVITY_LOG_RETENTION_ENABLED:-true}
      - ActivityLogRetention__RoutineRetentionDays=${ACTIVITY_LOG_ROUTINE_RETENTION_DAYS:-30}
      - ActivityLogRetention__ImportantRetentionDays=${ACTIVITY_LOG_IMPORTANT_RETENTION_DAYS:-365}
      - ActivityLogRetention__MaxRows=${ACTIVITY_LOG_MAX_ROWS:-500000}
      - ActivityLogRetention__EmailLogRetentionDays=${ACTIVITY_LOG_EMAIL_RETENTION_DAYS:-365}
      - ActivityLogRetention__MaxEmailLogRows=${ACTIVITY_LOG_MAX_EMAIL_ROWS:-200000}
      - ActivityLogRetention__BatchSize=${ACTIVITY_LOG_BATCH_SIZE:-5000}
      - ActivityLogRetention__CleanupIntervalHours=${ACTIVITY_LOG_CLEANUP_INTERVAL_HOURS:-6}
      - ClamAv__Enabled=${CLAMAV_ENABLED:-false}
      - ClamAv__Host=${CLAMAV_HOST:-clamav}
      - ClamAv__Port=${CLAMAV_PORT:-3310}
      - ClamAv__TimeoutSeconds=${CLAMAV_TIMEOUT_SECONDS:-10}
      - ClamAv__FailOpen=${CLAMAV_FAIL_OPEN:-false}
      - DATABASE_CORS_ORIGINS=http://${APP_HOST}:3000,http://127.0.0.1:3000,http://frontend:3000
      - SERVICE_AUTH_KEY=${SERVICE_AUTH_KEY}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
      - ADMIN_PASSWORD_CHANGE_REQUIRED=${ADMIN_PASSWORD_CHANGE_REQUIRED:-true}
      - Smtp__Host=${SMTP_HOST:-mailpit}
      - Smtp__Port=${SMTP_PORT:-1025}
      - Smtp__FromAddress=${SMTP_FROM:-noreply@cepem.local}
      - App__FrontendBaseUrl=${FRONTEND_PUBLIC_URL:-http://localhost:3000}
    volumes:
      - ./data/patient-photos:/app/patient-photos
      - ./data/patient-documents:/app/patient-documents
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - cepem_network

  # Healthcare API
  healthcare-api:
    build:
      context: ./backend
      dockerfile: HealthcareAPI/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HEALTHCARE_API_PORT}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS_HEALTHCARE}
      - JWT__SecretKey=${JWT_SECRET_KEY}
      - JWT__Issuer=${JWT_ISSUER}
      - JWT__Audience=${JWT_AUDIENCE}
      - JWT__AccessTokenMinutes=${JWT_ACCESS_TOKEN_MINUTES:-30}
      - JWT__RefreshTokenDays=${JWT_REFRESH_TOKEN_DAYS:-7}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - AI_SERVICE_URL=http://ai-service:8000
      - DatabaseApiUrl=${DATABASE_API_URL}
      - DatabaseApiServiceKey=${SERVICE_AUTH_KEY}
      - RateLimiting__LoginPermitLimit=${RATE_LIMITING__LOGINPERMITLIMIT:-10}
      - HEALTHCARE_CORS_ORIGINS=http://${APP_HOST}:3000,http://127.0.0.1:3000,http://frontend:3000
    depends_on:
      database-api:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cepem_network

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-http://localhost:3001}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      healthcare-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cepem_network


  # Observability (dev): Prometheus scrapes /metrics of both APIs, Grafana
  # renders the provisioned dashboard. Grafana: http://127.0.0.1:3001
  # (anonymous viewer enabled; admin user/password from .env)
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --config.expand-env=true
      - --storage.path=/alertmanager
    environment:
      - ALERTMANAGER_SMTP_SMARTHOST=${ALERTMANAGER_SMTP_SMARTHOST:-localhost:25}
      - ALERTMANAGER_SMTP_FROM=${ALERTMANAGER_SMTP_FROM:-alertmanager@cepem.local}
      - ALERTMANAGER_SMTP_USER=${ALERTMANAGER_SMTP_USER:-}
      - ALERTMANAGER_SMTP_PASSWORD=${ALERTMANAGER_SMTP_PASSWORD:-}
      - ALERTMANAGER_SMTP_REQUIRE_TLS=${ALERTMANAGER_SMTP_REQUIRE_TLS:-false}
      - ALERTMANAGER_EMAIL_TO=${ALERTMANAGER_EMAIL_TO:-admin@cepem.local}
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - cepem_network

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./deploy/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - cepem_network

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    depends_on:
      - alertmanager
      - blackbox-exporter
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - cepem_network

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - cepem_network

  # Local development/CI SMTP sink — anything the app sends lands in the
  # Mailpit mailbox instead of a real MTA (web UI on http://localhost:8025).
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - cepem_network

volumes:
  prometheus_data:
    name: cepem_prometheus_data
  grafana_data:
    name: cepem_grafana_data
  mysql_data:
    name: cepem_mysql_data

networks:
  cepem_network:
    driver: bridge
