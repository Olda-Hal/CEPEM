global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: healthcare-api
    metrics_path: /metrics
    static_configs:
      - targets: ["healthcare-api:80"]
        labels:
          service: healthcare-api

  - job_name: database-api
    metrics_path: /metrics
    # Read-only, internal-only scrape: database-api requires X-Service-Key
    metrics_path: /metrics
    static_configs:
      - targets: ["database-api:5001"]
        labels:
          service: database-api
