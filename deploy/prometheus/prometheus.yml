global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: healthcare-api
    metrics_path: /metrics
    static_configs:
      - targets: ["healthcare-api:80"]
        labels:
          service: healthcare-api

  - job_name: database-api
    # Internal-only scrape: database-api exposes /metrics without auth on the
    # private network (ServiceAuthMiddleware covers /api/* only)
    metrics_path: /metrics
    static_configs:
      - targets: ["database-api:5001"]
        labels:
          service: database-api

  # Synthetic availability probe through the public nginx entrypoint.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://frontend:3000/health
        labels:
          service: frontend
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
