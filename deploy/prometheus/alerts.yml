groups:
  - name: cepem-availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"healthcare-api|database-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus has not scraped {{ $labels.instance }} for 2 minutes."

      - alert: FrontendProbeFailing
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Public entrypoint is not serving traffic"
          description: "The blackbox HTTP probe of {{ $labels.instance }} has failed for 2 minutes."

  - name: cepem-application
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_received_total{code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_received_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of API requests are failing"
          description: "5xx responses have exceeded 5% of all requests for 5 minutes."

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency is above 2 seconds"
          description: "The 95th percentile request duration has stayed above 2s for 10 minutes."

      - alert: NoApiTraffic
        expr: sum(rate(http_requests_received_total[15m])) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No API traffic observed"
          description: "Both APIs have received no requests for 15 minutes; check the edge proxy."
