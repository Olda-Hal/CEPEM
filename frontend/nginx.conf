pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Bearer tokens travel in the intake path; log only the redacted path and
    # never the query string or Referer.
    map $uri $redacted_uri {
        default $uri;
        ~^/intake/[^/]+$ /intake/***;
        ~^/api/events/intake-form-links/[^/]+(/submit)?$ /api/events/intake-form-links/***;
    }

    log_format cepem '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $redacted_uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';

    access_log /var/log/nginx/access.log cepem;

    server {
        listen 3000;
        server_name localhost;

        # Scanned intake PDFs are commonly 1–5 MB; nginx defaults to 1 MB.
        client_max_body_size 20m;

        root /usr/share/nginx/html;
        index index.html index.htm;

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Handle React Router. The SPA shell must never be cached: a new
        # deploy changes the hashed asset names, and a stale index.html keeps
        # loading old JS.
        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }

        # API proxy to backend
        location /api/ {
            client_max_body_size 20m;
            proxy_pass http://healthcare-api:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Service health probes used by the admin health dashboard
        location = /health {
            proxy_pass http://healthcare-api:80;
            proxy_set_header Host $host;
        }

        location = /db-health {
            proxy_pass http://database-api:5001/api/health;
            proxy_set_header Host $host;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
