
services:
  # Test Services
  healthcare-api-tests:
    build:
      context: ./backend
      dockerfile: HealthcareAPI.Tests/Dockerfile.test
    volumes:
      - ./test-results:/results/healthcare-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
    restart: "no"
    networks:
      - cepem-test-network

  database-api-tests:
    build:
      context: ./backend
      dockerfile: DatabaseAPI.Tests/Dockerfile.test
    volumes:
      - ./test-results:/results/database-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
    restart: "no"
    networks:
      - cepem-test-network


  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    volumes:
      - ./test-results:/results/frontend
    restart: "no"
    networks:
      - cepem-test-network

  # Test Results Aggregator
  test-reporter:
    image: alpine:3.20
    depends_on:
      healthcare-api-tests:
        condition: service_completed_successfully
      database-api-tests:
        condition: service_completed_successfully
      frontend-tests:
        condition: service_completed_successfully
    volumes:
      - ./test-results:/results
      - ./scripts:/scripts
    command: ["sh", "-c", "apk add --no-cache bash bc >/dev/null && /scripts/generate-test-report.sh"]
    networks:
      - cepem-test-network

networks:
  cepem-test-network:
    driver: bridge

volumes:
  test-results:
