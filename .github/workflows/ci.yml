name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - refactor
  workflow_dispatch:

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CEPEM.sln

      - name: Build
        run: dotnet build CEPEM.sln --no-restore

      - name: Test DatabaseAPI
        run: dotnet test backend/DatabaseAPI.Tests/DatabaseAPI.Tests.csproj --no-build --logger "trx" --results-directory ./test-results

      - name: Test HealthcareAPI
        run: dotnet test backend/HealthcareAPI.Tests/HealthcareAPI.Tests.csproj --no-build --logger "trx" --results-directory ./test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/**/*.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend build & typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Build (includes typecheck)
        working-directory: frontend
        run: npm run build

  containers:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build containers
        run: docker compose build
