services:
  mysql:
    image: mysql:8.0
    container_name: cepem_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - cepem_network

  healthcare-api:
    build:
      context: ./backend/HealthcareAPI
      dockerfile: Dockerfile
    container_name: cepem_healthcare_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - JWT__SecretKey=${JWT_SECRET_KEY}
      - JWT__Issuer=${JWT_ISSUER}
      - JWT__Audience=${JWT_AUDIENCE}
      - DatabaseApiUrl=http://database-api:5001
      - DatabaseApiServiceKey=${SERVICE_AUTH_KEY}
      - HEALTHCARE_CORS_ORIGINS=https://${DOMAIN_NAME}
    depends_on:
      database-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cepem_network

  database-api:
    build:
      context: ./backend/DatabaseAPI
      dockerfile: Dockerfile
    container_name: cepem_database_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=${DATABASE_API_CONNECTION_STRING}
      - PhotoEncryption__Key=${PHOTO_ENCRYPTION_KEY}
      - PhotoEncryption__IV=${PHOTO_ENCRYPTION_IV}
      - DocumentEncryption__Key=${DOCUMENT_ENCRYPTION_KEY}
      - DocumentEncryption__IV=${DOCUMENT_ENCRYPTION_IV}
      - PhotoStorage__Path=${PHOTO_STORAGE_PATH}
      - DocumentStorage__Path=${DOCUMENT_STORAGE_PATH}
      - DATABASE_CORS_ORIGINS=https://${DOMAIN_NAME}
      - SERVICE_AUTH_KEY=${SERVICE_AUTH_KEY}
    volumes:
      - ./data/patient-photos:/app/patient-photos
      - ./data/patient-documents:/app/patient-documents
    networks:
      - cepem_network


  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    container_name: cepem_frontend
    restart: unless-stopped
    networks:
      - cepem_network

volumes:
  mysql_data:
    name: cepem_mysql_data

networks:
  cepem_network:
    driver: bridge
