services:
  mysql:
    image: mysql:8.0
    container_name: cepem_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - cepem_network

  healthcare-api:
    build:
      context: ./backend/HealthcareAPI
      dockerfile: Dockerfile
    container_name: cepem_healthcare_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - JWT__SecretKey=${JWT_SECRET_KEY}
      - JWT__Issuer=${JWT_ISSUER}
      - JWT__Audience=${JWT_AUDIENCE}
      - DatabaseApiUrl=http://database-api:5001
      - DatabaseApiServiceKey=${SERVICE_AUTH_KEY}
      - HEALTHCARE_CORS_ORIGINS=https://${DOMAIN_NAME}
    depends_on:
      database-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cepem_network

  database-api:
    build:
      context: ./backend/DatabaseAPI
      dockerfile: Dockerfile
    container_name: cepem_database_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=${DATABASE_API_CONNECTION_STRING}
      - PhotoEncryption__Key=${PHOTO_ENCRYPTION_KEY}
      - PhotoEncryption__IV=${PHOTO_ENCRYPTION_IV}
      - DocumentEncryption__Key=${DOCUMENT_ENCRYPTION_KEY}
      - DocumentEncryption__IV=${DOCUMENT_ENCRYPTION_IV}
      - PhotoStorage__Path=${PHOTO_STORAGE_PATH}
      - DocumentStorage__Path=${DOCUMENT_STORAGE_PATH}
      - DATABASE_CORS_ORIGINS=https://${DOMAIN_NAME}
      - SERVICE_AUTH_KEY=${SERVICE_AUTH_KEY}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
      # Password-reset e-mail delivery (leave SMTP_HOST empty to log the link only)
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - Smtp__UserName=${SMTP_USER:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromAddress=${SMTP_FROM:-noreply@cepem.local}
      - Smtp__FromName=${SMTP_FROM_NAME:-CEPEM}
      # Public SPA URL used in reset links (must not be localhost!)
      - App__FrontendBaseUrl=${FRONTEND_PUBLIC_URL:-http://localhost:3000}
    volumes:
      - ./data/patient-photos:/app/patient-photos
      - ./data/patient-documents:/app/patient-documents
    networks:
      - cepem_network


  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    container_name: cepem_frontend
    restart: unless-stopped
    networks:
      - cepem_network

  # Observability: /metrics on both APIs, scraped by Prometheus, rendered
  # by Grafana. Both read credentials purely from env — no secrets in the
  # repo. Access Grafana at http://127.0.0.1:${GRAFANA_PORT}.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cepem_prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - cepem_network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cepem_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Without this Grafana links to http://localhost:3000. For an SSH tunnel
      # use http://localhost:3001; for a public URL use e.g.
      # https://cepem.example.com/grafana/ and set
      # GRAFANA_SERVE_FROM_SUB_PATH=true (plus an nginx location).
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      - GF_SERVER_SERVE_FROM_SUB_PATH=${GRAFANA_SERVE_FROM_SUB_PATH:-false}
      - GF_SECURITY_COOKIE_SECURE=${GRAFANA_COOKIE_SECURE:-false}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - cepem_network

volumes:
  mysql_data:
    name: cepem_mysql_data
  prometheus_data:
    name: cepem_prometheus_data
  grafana_data:
    name: cepem_grafana_data

networks:
  cepem_network:
    driver: bridge
