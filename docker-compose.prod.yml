x-logging: &default-logging
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0.40
    container_name: cepem_mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cepem_network

  healthcare-api:
    build:
      context: ./backend
      dockerfile: HealthcareAPI/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - JWT__SecretKey=${JWT_SECRET_KEY}
      - JWT__Issuer=${JWT_ISSUER}
      - JWT__Audience=${JWT_AUDIENCE}
      - JWT__AccessTokenMinutes=${JWT_ACCESS_TOKEN_MINUTES:-30}
      - JWT__RefreshTokenDays=${JWT_REFRESH_TOKEN_DAYS:-7}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - AI_SERVICE_URL=http://ai-service:8000
      - DatabaseApiUrl=http://database-api:5001
      - DatabaseApiServiceKey=${SERVICE_AUTH_KEY}
      - HEALTHCARE_CORS_ORIGINS=https://${DOMAIN_NAME}
    depends_on:
      database-api:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cepem_network

  # Antivirus scanning for uploaded photos, PDFs and MEIK measurements.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - cepem_network

  # Paper intake-form digitisation (OCR + optional vision model).
  ai-service:
    build:
      context: ./backend/AIService
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TESSERACT_LANG=${TESSERACT_LANG:-ces+eng}
      - VISION_API_URL=${VISION_API_URL:-}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_MODEL=${VISION_MODEL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cepem_network

  database-api:
    build:
      context: ./backend
      dockerfile: DatabaseAPI/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=${DATABASE_API_CONNECTION_STRING}
      - PhotoEncryption__Key=${PHOTO_ENCRYPTION_KEY}
      - PhotoEncryption__IV=${PHOTO_ENCRYPTION_IV}
      - DocumentEncryption__Key=${DOCUMENT_ENCRYPTION_KEY}
      - DocumentEncryption__IV=${DOCUMENT_ENCRYPTION_IV}
      - PhotoStorage__Path=${PHOTO_STORAGE_PATH}
      - DocumentStorage__Path=${DOCUMENT_STORAGE_PATH}
      - DocumentRetention__Enabled=${DOCUMENT_RETENTION_ENABLED:-true}
      - DocumentRetention__RetentionDays=${DOCUMENT_RETENTION_RETENTION_DAYS:-30}
      - DocumentRetention__CleanupIntervalHours=${DOCUMENT_RETENTION_CLEANUP_INTERVAL_HOURS:-24}
      - ActivityLogRetention__Enabled=${ACTIVITY_LOG_RETENTION_ENABLED:-true}
      - ActivityLogRetention__RoutineRetentionDays=${ACTIVITY_LOG_ROUTINE_RETENTION_DAYS:-30}
      - ActivityLogRetention__ImportantRetentionDays=${ACTIVITY_LOG_IMPORTANT_RETENTION_DAYS:-365}
      - ActivityLogRetention__MaxRows=${ACTIVITY_LOG_MAX_ROWS:-500000}
      - ActivityLogRetention__EmailLogRetentionDays=${ACTIVITY_LOG_EMAIL_RETENTION_DAYS:-365}
      - ActivityLogRetention__MaxEmailLogRows=${ACTIVITY_LOG_MAX_EMAIL_ROWS:-200000}
      - ActivityLogRetention__BatchSize=${ACTIVITY_LOG_BATCH_SIZE:-5000}
      - ActivityLogRetention__CleanupIntervalHours=${ACTIVITY_LOG_CLEANUP_INTERVAL_HOURS:-6}
      - ClamAv__Enabled=${CLAMAV_ENABLED:-true}
      - ClamAv__Host=${CLAMAV_HOST:-clamav}
      - ClamAv__Port=${CLAMAV_PORT:-3310}
      - ClamAv__TimeoutSeconds=${CLAMAV_TIMEOUT_SECONDS:-20}
      - ClamAv__FailOpen=${CLAMAV_FAIL_OPEN:-false}
      - DATABASE_CORS_ORIGINS=https://${DOMAIN_NAME}
      - SERVICE_AUTH_KEY=${SERVICE_AUTH_KEY}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
      - ADMIN_PASSWORD_CHANGE_REQUIRED=${ADMIN_PASSWORD_CHANGE_REQUIRED:-true}
      # Password-reset e-mail delivery (leave SMTP_HOST empty to log the link only)
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - Smtp__UserName=${SMTP_USER:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromAddress=${SMTP_FROM:-noreply@cepem.local}
      - Smtp__FromName=${SMTP_FROM_NAME:-CEPEM}
      # Public SPA URL used in reset links (must not be localhost!)
      - App__FrontendBaseUrl=${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      # Pre-visit intake form reminder (Reserved slots → e-mail with a link)
      - IntakeReminder__Enabled=${INTAKE_REMINDER_ENABLED:-true}
      - IntakeReminder__LeadDays=${INTAKE_REMINDER_LEAD_DAYS:-3}
      - IntakeReminder__CheckIntervalMinutes=${INTAKE_REMINDER_CHECK_INTERVAL_MINUTES:-15}
      # Day-before appointment SMS. Default "log" writes only to the SMS log;
      # set SMS_PROVIDER=http and SMS_ENDPOINT to call a JSON gateway.
      - Sms__Enabled=${SMS_ENABLED:-true}
      - Sms__Provider=${SMS_PROVIDER:-log}
      - Sms__Endpoint=${SMS_ENDPOINT:-}
      - Sms__ApiKey=${SMS_API_KEY:-}
      - Sms__Sender=${SMS_SENDER:-CEPEM}
      - SmsReminder__Enabled=${SMS_REMINDER_ENABLED:-true}
      - SmsReminder__LeadHours=${SMS_REMINDER_LEAD_HOURS:-24}
      - SmsReminder__CheckIntervalMinutes=${SMS_REMINDER_CHECK_INTERVAL_MINUTES:-30}
    volumes:
      - ./data/patient-photos:/app/patient-photos
      - ./data/patient-documents:/app/patient-documents
    depends_on:
      mysql:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - cepem_network


  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        # Public Grafana URL baked into the frontend. Empty falls back to the
        # same-origin /grafana proxy in MonitoringPage.tsx.
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      healthcare-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cepem_network

  # Observability: /metrics on both APIs, scraped by Prometheus, rendered
  # by Grafana. Both read credentials purely from env — no secrets in the
  # repo. Access Grafana at http://127.0.0.1:${GRAFANA_PORT}.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --config.expand-env=true
      - --storage.path=/alertmanager
    environment:
      - ALERTMANAGER_SMTP_SMARTHOST=${ALERTMANAGER_SMTP_SMARTHOST:-localhost:25}
      - ALERTMANAGER_SMTP_FROM=${ALERTMANAGER_SMTP_FROM:-alertmanager@cepem.local}
      - ALERTMANAGER_SMTP_USER=${ALERTMANAGER_SMTP_USER:-}
      - ALERTMANAGER_SMTP_PASSWORD=${ALERTMANAGER_SMTP_PASSWORD:-}
      - ALERTMANAGER_SMTP_REQUIRE_TLS=${ALERTMANAGER_SMTP_REQUIRE_TLS:-false}
      - ALERTMANAGER_EMAIL_TO=${ALERTMANAGER_EMAIL_TO:-admin@cepem.local}
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - cepem_network

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./deploy/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - cepem_network

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    depends_on:
      - alertmanager
      - blackbox-exporter
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - cepem_network

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Allow the CEPEM monitoring page to embed Grafana in an iframe.
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # Public URL served by nginx at /grafana/. Override GRAFANA_ROOT_URL
      # (e.g. http://localhost:3001) only when using an SSH tunnel.
      - GF_SERVER_DOMAIN=${DOMAIN_NAME:-localhost}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://${DOMAIN_NAME:-localhost}/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=${GRAFANA_SERVE_FROM_SUB_PATH:-true}
      - GF_SECURITY_COOKIE_SECURE=${GRAFANA_COOKIE_SECURE:-true}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - cepem_network

volumes:
  mysql_data:
    name: cepem_mysql_data
  prometheus_data:
    name: cepem_prometheus_data
  grafana_data:
    name: cepem_grafana_data

networks:
  cepem_network:
    driver: bridge
