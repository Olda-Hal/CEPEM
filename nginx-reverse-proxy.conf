# Reverse proxy for the CEPEM platform.
# Replace YOUR_DOMAIN with the deployed domain (or template this file with
# sed/envsubst during deployment) - see DEPLOYMENT.md.

upstream frontend {
    server 127.0.0.1:3000;
}

upstream healthcare_api {
    server 127.0.0.1:5000;
}

# WebSocket upgrade for Grafana Live.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Bearer tokens travel in the intake/reset paths. Log only the redacted path
# and never the query string or Referer (the browser sends the intake URL as
# Referer for same-origin assets).
map $uri $redacted_uri {
    default $uri;
    ~^/intake/[^/]+$ /intake/***;
    ~^/api/events/intake-form-links/[^/]+(/submit)?$ /api/events/intake-form-links/***;
}

log_format cepem '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $redacted_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_user_agent"';

access_log /var/log/nginx/access.log cepem;

server {
    server_tokens off;
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    server_tokens off;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP stapling requires a resolver to reach the OCSP responders
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
    # The SPA has no inline scripts; styles are React style attributes and
    # CSS files. Sentry ingestion is allowed when VITE_SENTRY_DSN is set.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.ingest.sentry.io https://*.sentry.io; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self' blob:;" always;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://healthcare_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Grafana is published as a same-origin sub-path so the link baked into
    # the SPA works on any hostname. Keep Grafana itself bound to loopback.
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Defining any add_header here disables inheritance of the server-level
        # security headers, so repeat them. Grafana needs inline scripts, hence
        # no CSP on this sub-path.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
        # The server block sets DENY globally; Grafana is embedded by the CEPEM
        # SPA on the same origin, so allow same-origin framing here.
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
